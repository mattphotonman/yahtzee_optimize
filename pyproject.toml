[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yahtzee-optimize"
version = "0.1.0"
description = "Find optimal Yahtzee strategy and expected scores for custom roll objectives"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["."]
include = ["yahtzee_optimize*"]
